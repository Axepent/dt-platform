server {
    listen 80;

    location /twin/ {
        root /usr/share/nginx/html;
        types {
            application/tm+json jsonld;
            application/json json;
        }
    }

    location /ui/ {
        root /usr/share/nginx/html;
    }

    location /api/ {
        limit_except GET { deny all; }
        proxy_pass http://nginx:80;
        proxy_set_header Authorization "Basic ZGl0dG86ZGl0dG8=";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
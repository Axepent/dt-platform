<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Манекен · 3D-сцена двійника</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color: #1c2d33; font: 14px system-ui, sans-serif; }
    body { margin: 0; background: #d6e2e4; }
    canvas { position: fixed; inset: 0; display: block; }
    #hud { z-index: 1; position: fixed; top: 18px; right: 18px; box-sizing: border-box;
      width: min(320px, calc(100vw - 36px)); padding: 17px 19px; border-radius: 12px;
      background: #f9fcfcee; box-shadow: 0 5px 24px #233b451a; }
    h1 { margin: 0 0 5px; font-size: 19px; }
    #thing, #stats, #status { font-size: 12px; }
    #thing, #stats { color: #53656a; }
    #stats, #status { margin-top: 8px; }
    .meta { display: flex; gap: 8px 14px; margin: 13px 0 8px; flex-wrap: wrap; }
    dd { margin: 0; font-weight: 640; }
    dt { color: #53656a; font-size: 11px; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    td, th { padding: 5px 0; border-top: 1px solid #dce6e8; }
    th { text-align: left; font-weight: 500; }
    td { text-align: right; }
    nav { display: flex; gap: 12px; margin-top: 11px; }
    nav a { color: #14665c; }
    .stale, .error { color: #a62824; }
    @media (max-width: 640px) { #hud { top: 10px; right: 10px; width: 248px; padding: 10px 12px; } }
  </style>
  <script type="importmap">
    {"imports":{
      "three":"./node_modules/three/build/three.module.js",
      "three/addons/":"./node_modules/three/examples/jsm/",
      "3d-tiles-renderer/three":"./node_modules/3d-tiles-renderer/build/index.three.js"
    }}
  </script>
</head>
<body>
  <aside id="hud" aria-label="Телеметрія">
    <h1>Роботизований манекен</h1>
    <div id="thing"></div>
    <dl class="meta">
      <div><dt>Ревізія</dt><dd id="rev">—</dd></div>
      <div><dt>Давність</dt><dd id="age">—</dd></div>
      <div><dt>Прив’язано</dt><dd id="bound">—</dd></div>
    </dl>
    <table aria-label="Кути суглобів"><tbody id="vals"></tbody></table>
    <div id="stats"></div>
    <div id="status" role="status">Завантаження сцени…</div>
    <nav aria-label="Види камери">
      <a href="?view=near">Поблизу</a>
      <a href="?view=hall">Майданчик</a>
      <a href="?view=far">Здалеку</a>
    </nav>
  </aside>
  <script type="module" src="main.js"></script>
</body>
</html>
